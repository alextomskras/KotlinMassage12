apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
// Без этого плагина Firebase падает при инициализации: "Default FirebaseApp is not initialized"
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.example.fess.kotlinmassage1"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fess.kotlinmassage1"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Firebase BOM (modern, replaces old firebase-* 16/17 artifacts)
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    // Storage больше не нужен: картинки едут base64 в Realtime DB

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    // Groupie 2.x недоступен (jcenter мёртв, jitpack 401) — используется локальный шим
    // com.xwray.groupie в app/src/main/java/com/xwray/groupie/Groupie.kt
    // ВНИМАНИЕ: если в classpath APK всё ещё попадает настоящий com.xwray.groupie из libs/*.jar
    // (fileTree ниже), его ViewHolder.itemView package-private -> IllegalAccessError на телефоне.
    // Такие jar нужно удалить из app/libs/, иначе шим игнорируется рантаймом.
    implementation 'com.squareup.picasso:picasso:2.8'
}
